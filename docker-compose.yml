# ============================================================
#  三方登录统一接入服务 · 本地一键启动
#
#    docker compose up --build        # 首次（会构建镜像）
#    docker compose up -d             # 后台
#    docker compose logs -f app       # 看后端日志
#    docker compose down              # 停止（保留数据）
#    docker compose down -v           # 停止并清空数据库
#
#  启动后访问：http://localhost:8080/admin
#  默认管理员：admin / admin12345（可用下方 ADMIN_PASSWORD 覆盖）
#
#  启动顺序由 depends_on 强制编排：
#    pg(healthy) ─► uc-db(一次性，建 user_center 库) ─► usercenter
#                 ├─► migrate(一次性) ─► adminseed(一次性) ─► app
#    redis(healthy)┘
#
#  用户中心（usercenter）与登录服务是两个进程、两个数据库：
#    social-login  →  http://localhost:8080   （登录/授权/令牌/绑定）
#    usercenter    →  http://localhost:8099   （账号主数据，/healthz /readyz /metrics）
#
#  账号体系默认 ACCOUNT_PROVIDER=stub（账号在登录服务进程内存里）。要跑完整链路：
#    ACCOUNT_PROVIDER=http docker compose up -d
#  此时登录服务会通过注册同步把应用推到 usercenter（启动即全量对账，之后每 5 分钟一次）。
#  注意 app 依赖 usercenter 健康：冷启动时先起对端，避免首批登录拿到 APP.UNKNOWN。
#
#  ⚠️ 本文件只用于本地开发：
#     - 数据库口令、开发主密钥都是明文默认值，生产必须换掉；
#     - 生产环境应关闭 migrate.enabled，由发布流程单独执行迁移。
# ============================================================

name: social-login

# ---------- 公共片段 ----------

# 三个服务共用同一镜像，Compose 只会构建一次。
x-app: &app
  image: social-login:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
      APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
      VERSION: ${VERSION:-docker}
  restart: "no"

# 指向 compose 网络内的服务名（而不是 127.0.0.1）
x-app-env: &app-env
  SOCIAL_LOGIN_DATABASE_DSN: postgres://postgres:postgres@pg:5432/social_login?sslmode=disable
  SOCIAL_LOGIN_CACHE_ADDR: redis:6379
  # 固定开发主密钥：留空时 debug 模式会每次启动临时生成，
  # 导致重启后已加密保存的渠道凭据无法解密。
  # ⚠️ 仅用于本地；生产必须改为密钥管理系统下发。
  SOCIAL_LOGIN_SECURITY_MASTER_KEY: ${SOCIAL_LOGIN_SECURITY_MASTER_KEY:-+CCIh0DbO4eCpxQ0BB8wmuk0/bjR0XU8oOR/VvLNInc=}
  SOCIAL_LOGIN_MIGRATE_ENABLED: "true"

services:

  # ---------- 依赖 ----------

  pg:
    image: ${REGISTRY:-docker.m.daocloud.io/library}/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_login
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_login"]
      interval: 3s
      timeout: 3s
      retries: 30
    # 从宿主机连库（验收测试 test/acceptance 需要）。用 15432 避开宿主可能已占用的 5432。
    # 只绑回环地址：本地开发要直连，但绝不暴露到局域网。
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    image: ${REGISTRY:-docker.m.daocloud.io/library}/redis:7-alpine
    # 本地开发不需要持久化，省掉 RDB/AOF 噪音
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    # 只绑定回环地址：本地调试与集成测试（cache 包的 SessionKeyStore）需要从宿主机
    # 直连 Redis，但绝不能暴露到局域网。用 16379 避开宿主机可能已占用的 6379。
    ports:
      - "127.0.0.1:16379:6379"

  # ---------- 初始化（一次性，跑完即退出） ----------

  migrate:
    <<: *app
    command: ["/app/bin/migrate", "-config", "/app/configs/config.yaml", "-dir", "up"]
    environment:
      <<: *app-env
    depends_on:
      pg:
        condition: service_healthy

  # 用户中心用独立数据库。pg 的 POSTGRES_DB 只会建一个库，
  # 而 compose 的初始化脚本只在数据卷为空时执行——对已经存在的 pg-data
  # 无效。所以用一次性容器显式建库（幂等：存在则跳过）。
  uc-db:
    image: ${REGISTRY:-docker.m.daocloud.io/library}/postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    # 用数组形式 + 字面块（|），不要折叠（>）：
    # 折叠会把多行拼成一行，而里面嵌套的双引号在 plain scalar 里会被当成
    # 字面字符（`\"` 不会变成引号），sh 直接报 `unexpected "||"`。
    command:
      - sh
      - -c
      - |
        if psql -h pg -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'user_center'" | grep -q 1; then
          echo "user_center 已存在，跳过"
        else
          psql -h pg -U postgres -d postgres -c "CREATE DATABASE user_center"
        fi
    depends_on:
      pg:
        condition: service_healthy

  adminseed:
    <<: *app
    command:
      - /app/bin/adminseed
      - -dsn
      - postgres://postgres:postgres@pg:5432/social_login?sslmode=disable
      - -username
      - ${ADMIN_USER:-admin}
      - -password
      - ${ADMIN_PASSWORD:-admin12345}
      - -display-name
      - ${ADMIN_DISPLAY_NAME:-本地开发 super_admin}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------- 应用 ----------

  app:
    <<: *app
    command: ["/app/bin/social-login", "-config", "/app/configs/config.yaml"]
    environment:
      <<: *app-env
      # 账号体系：stub = 进程内存（默认，重启即丢）；http = 真实用户中心。
      # 切成 http 前确认 usercenter 已健康，否则该应用所有登录都会
      # ACCOUNT.UNAVAILABLE（应用未注册时是 APP.UNKNOWN，不可重试）。
      SOCIAL_LOGIN_ACCOUNT_PROVIDER: ${ACCOUNT_PROVIDER:-stub}
      SOCIAL_LOGIN_ACCOUNT_HTTP_BASE_URL: ${ACCOUNT_BASE_URL:-http://usercenter:8099}
      SOCIAL_LOGIN_ACCOUNT_HTTP_TOKEN: ${UC_TOKEN:-dev-usercenter-token}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # 审计导出文件（§15.4 H 组）。不挂卷的话容器一重启，
      # 已完成的导出任务就变成"元数据说成功、文件却不在"。
      - export-data:/app/var/exports
      # 签名密钥状态（F 组轮换）。不挂卷的话容器重启后轮换结果丢失，
      # JWKS 会突然换一把，业务方缓存的公钥全部失效。
      - key-data:/app/var/keys
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      adminseed:
        condition: service_completed_successfully
      # 账号体系虽然是可切换的（stub / http），但冷启动时若 login 先于
      # usercenter 就绪，应用注册对账会失败，直到下一次全量重放（5 分钟）
      # 才自愈——这 5 分钟里所有登录都是 APP.UNKNOWN，且报错指向"应用不存在"，
      # 很难联想到"对端还没起来"。用一个依赖换掉这个排查陷阱。
      usercenter:
        condition: service_healthy

  # ---------- 用户中心（账号主数据） ----------

  usercenter:
    <<: *app
    command: ["/app/bin/usercenter", "-config", "/app/configs/usercenter.yaml"]
    environment:
      # 独立库：与 social-login 不共享表，跨服务只走 HTTP 契约。
      UC_DATABASE_DSN: postgres://postgres:postgres@pg:5432/user_center?sslmode=disable
      UC_SECURITY_SERVICE_TOKEN: ${UC_TOKEN:-dev-usercenter-token}
      # 本地固定主密钥，避免重启后已入库的凭据解不开。
      # ⚠️ 仅本地：生产必须由密钥管理系统注入 UC_SECURITY_MASTER_KEY。
      UC_SECURITY_MASTER_KEY: ${UC_MASTER_KEY:-dSmcH26cwhbLBQSMCD2/E3NV9Hs4c8Bmz+E75YP4Uo4=}
      UC_MIGRATE_ENABLED: "true"
    ports:
      - "${UC_PORT:-8099}:8099"
    # 镜像里的 HEALTHCHECK 打的是 8080（social-login 的端口）。
    # 不覆盖的话本容器会一直是 unhealthy，编排层据此拒绝放流量——
    # 而服务其实完全正常，这类"健康检查打错端口"的故障最难联想到。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    depends_on:
      pg:
        condition: service_healthy
      uc-db:
        condition: service_completed_successfully

volumes:
  pg-data:
  export-data:
  key-data:

# 用户中心（账号主数据服务）· 本地开发配置
#
# ⚠️ 本文件【不得包含真实密钥】。生产用环境变量覆盖（前缀 UC_）：
#     UC_DATABASE_DSN / UC_SECURITY_SERVICE_TOKEN / UC_SECURITY_MASTER_KEY
#
# 与 social-login 的配置完全独立：本服务没有 Redis、没有 JWT、没有渠道配置。
# 共用一份配置文件会让"这里有但代码不读"的字段混进来，那是最容易骗过运维的东西。

server:
  # 与 social-login 的 8080 分开，便于同时在本机起两个服务联调。
  addr: "0.0.0.0:8099"
  # debug 会放宽若干"生产必须项"（允许临时密钥），并关闭 gin 的调试输出。
  mode: "debug"
  shutdown_timeout: "15s"
  # 本服务的请求体只有几十字节，64KB 已经非常宽松。
  max_body_bytes: 65536

database:
  # 独立数据库：本服务与 social-login 不共享表、不跨库 join。
  # 本地 compose 里 PG 映射到 15432，库名 user_center 需先创建
  # （见 scripts/dev-usercenter.sh）。
  dsn: "postgres://postgres:postgres@127.0.0.1:15432/user_center?sslmode=disable"
  max_conns: 20
  min_conns: 2
  max_conn_lifetime: "1h"
  max_conn_idle_time: "10m"
  connect_timeout: "5s"
  # 服务端语句超时，必须明显小于消费方的 3s 调用超时：
  # 让"我们卡住了"在我们的日志里可见，而不是只在对方那里表现为超时。
  statement_timeout: "2s"
  # 慢查询阈值（只记录，不中断）。应明显小于 statement_timeout：
  # 这样"快要超时的语句"先出现在日志里，而不是等它被杀掉才发现。
  # 日志里只有 SQL 模板与参数个数，没有参数值（手机号/密文不进日志）。
  slow_query_threshold: "200ms"

security:
  # 服务间鉴权 Bearer token（服务级，不区分应用）。
  # 生产必须配置且由密钥管理系统注入；本地固定一个便于脚本联调。
  service_token: "dev-usercenter-token"
  # 凭证哈希的静态盐。⚠️ 必须稳定：换盐等于让所有历史凭证的 hash 失效。
  claim_salt: "dev-usercenter-claim-salt-do-not-use-in-prod"
  # 信封加密的密钥版本，写入 account_claims.dek_id。
  kek_id: "uc-kek-v1"
  # AES-256 主密钥（Base64）。留空时 debug 模式临时生成并打印警告——
  # 重启后旧密文无法解密，仅限本地。下面这把是本地开发专用的固定密钥，
  # 只为"重启后仍能解开本地数据"，**不得用于任何共享环境**。
  master_key: "dSmcH26cwhbLBQSMCD2/E3NV9Hs4c8Bmz+E75YP4Uo4="

log:
  level: "info"
  format: "console"
  # 留空输出到 stdout（容器里应由编排层收集）。配了才写文件，且不做切割。
  file: ""

migrate:
  # 本地开启，启动时自动建表。
  # ⚠️ 生产必须为 false：多副本滚动发布时并发迁移会互相抢锁。
  enabled: true

tracing:
  # 链路追踪。默认关闭——没有 collector 的环境里打开只会每分钟刷一批
  # "导出失败"，把真正的告警盖掉。
  #
  # 本地 compose 已内置 otel-collector + jaeger，默认打开；单独跑本服务时
  # 用 UC_TRACING_ENABLED=false 关掉，或把 endpoint 指向自己的 collector。
  enabled: false
  # 必须与 social-login 不同：Jaeger 的 service 下拉框按它分组。
  service_name: "usercenter"
  # 部署环境，出现在 deployment.environment.name 上。留空时用 "dev"。
  environment: "dev"
  # OTLP/HTTP 接收地址。collector 在同机时用 127.0.0.1；容器里用服务名。
  endpoint: "http://127.0.0.1:4318"
  # 内网明文。跨网络安全域时改为 false（走 TLS）。
  insecure: true
  # 入口采样比例。本服务写在链路的【下游】，上游已采样的请求会强制记录，
  # 所以这里的比例只影响"直接打到本服务的请求"。0.1 与登录中心保持一致。
  sample_ratio: 0.1
  export_timeout: "5s"
  batch_timeout: "5s"
  max_queue_size: 2048

notify:
  # 出站事件投递（用户中心 → 登录中心）。
  #
  # 只做一件事：换绑 / 注销 / 合并后通知登录侧失效它的本地 claim，
  # 避免它继续用过期手机号做归并判定（架构 §8.5 第 2 条）。
  #
  # 默认关闭：单独跑本服务或契约测试时打开它只会每 5 秒刷一条投递失败。
  enabled: false
  # 登录侧的接收地址（容器内用服务名，本机调试用 127.0.0.1:8080）。
  endpoint: "http://127.0.0.1:8080/internal/v1/usercenter/claim-invalidated"
  # 与登录侧 internal.service_token 保持一致。
  token: "dev-internal-token"
  # 扫描间隔与每轮条数。
  interval: "5s"
  batch: 20
  # 领取租约：进程在投递途中崩溃时，事件在这之后重新可投。
  lease: "60s"
  # 退避重试累计到该次数后进死信（期间按 5s、10s、20s… 指数退避，上限 1h）。
  max_attempts: 10

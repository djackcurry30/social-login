# 三方登录统一接入服务 · 本地开发配置
#
# ⚠️ 本文件【不得包含任何真实密钥】。密钥类配置一律通过环境变量注入：
#     SOCIAL_LOGIN_SECURITY_MASTER_KEY / SOCIAL_LOGIN_SECURITY_CLAIM_SALT 等
#   （环境变量优先级高于本文件，见 internal/bootstrap/config.go 的 Load）
#
# 生产环境请复制为 configs/config.prod.yaml 并交由配置管理系统渲染，
# .gitignore 已忽略 configs/local*.yaml 与 configs/*.prod.yaml。

server:
  addr: "0.0.0.0:8080"
  # debug 会放宽若干"生产必须项"校验（允许临时密钥、允许自动迁移）。
  mode: "debug"
  # 本服务对外可访问的基地址，用于拼三方回调地址：
  #   {callback_base_url}/v1/oauth/callback/{platform}
  # 必须与三方平台后台配置的回调地址完全一致，否则平台侧会拒绝授权。
  callback_base_url: "http://localhost:8080"
  issuer: "http://localhost:8080"
  shutdown_timeout: "15s"

database:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/social_login?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"
  slow_threshold: "200ms"
  # true 会打印每条 SQL，仅开发环境开启。
  log_sql: false

cache:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20

security:
  # 信封加密主密钥（Base64，32 字节）。留空时开发模式会临时生成并打印警告。
  # 生成方式：go run ./cmd/keygen
  master_key: ""
  kek_id: "local-kek-v1"
  # 身份凭证哈希的静态盐。⚠️ 必须保持稳定：
  # 变更它会导致已入库的 claim 哈希全部无法匹配，即"按手机号归并"能力整体失效。
  claim_salt: "dev-claim-salt-do-not-use-in-prod"
  app_secret_salt: "dev-app-secret-salt-do-not-use-in-prod"
  # 签名密钥状态文件目录（F 组轮换用）。
  #
  # 留空则管理端的 rotate/retire 会明确拒绝——只改内存的轮换在重启后就失效，
  # 那是最容易骗过运维的假象。
  # ⚠️ 目录权限 0700、文件 0600；这是"没有 KMS 时的可用实现"，
  # 生产应按 §8.3 换成 KMS / 配置中心托管。
  key_dir: "./var/keys"

jwt:
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
  # 签名密钥。留空时开发模式会临时生成（重启即更换 kid）。
  # 生成方式：go run ./cmd/keygen
  signing_keys: []
  # 配置示例：
  # signing_keys:
  #   - kid: "k-2026-10"
  #     private_key_file: "/etc/social-login/keys/k-2026-10.pem"

account:
  # stub = 内存桩（仅开发/演示/测试；账号存进程内存，重启即丢失）
  # http = 真实用户中心（生产必须用这个；生产模式下 stub 会被启动自检拒绝）
  #
  # ⚠️ 从 stub 切到 http 时，务必同时确认：
  #   1. 用户中心的 /accounts 系列接口符合 infrastructure/account/http.go 文件头的契约
  #   2. GetByClaim 指向主库（强一致读），不能是延迟从库
  #   3. Merge 真正按 Idempotency-Key 去重
  # 这三条不是"建议"，是归并与补偿正确性的前提。
  provider: "stub"
  http:
    # 用户中心根地址，例如 https://uc.internal 或 http://uc:8080
    base_url: ""
    # 服务间鉴权 Bearer token。生产由密钥管理系统注入环境变量：
    #   SOCIAL_LOGIN_ACCOUNT_HTTP_TOKEN
    # 留空只适用于无鉴权的内网联调环境（启动时会打 Warn）。
    token: ""
    # 单次调用总超时。用户中心是登录链路的同步依赖，
    # 比渠道调用更紧（整条链路预算 8s，Exchange+UserInfo 已占 5s）。
    timeout: "3s"
  # 已绑定用户登录时向用户中心回源核对（P1）。
  #
  # 补的是两个数据分叉：账号在用户中心被停用/注销后仍能登录；
  # 用户在平台侧换了手机号，本服务与用户中心的凭证长期不一致。
  gate:
    # 用户中心不可用时是否仍放行登录。
    #
    # false（默认，架构 §6.2）：无法确认账号状态就不签发令牌——安全优先，
    #   代价是用户中心故障期间所有登录都失败（ACCOUNT.UNAVAILABLE，可重试）。
    # true：登录可用性优先。此时对端故障窗口内，已停用/注销的账号也能登录，
    #   因为本服务无从得知。请只在明确接受这一后果时打开。
    allow_on_unavailable: false
    # 单次回源超时。它是"核对"，不该把用户中心的慢放大成用户转圈。
    timeout: "1s"
  # 应用注册同步（契约 v1.1 §2.6）。
  #
  # 用户中心按 app_key 隔离账号空间，未注册的应用一律 400 APP.UNKNOWN。
  # 所以"应用已注册"是登录的前置条件，不是一个可选的便利功能。
  # provider=stub 时本段自动不生效（桩没有"注册"这回事）。
  sync:
    # 关掉它属于应急手段：新建应用不会注册，这些应用的登录会被拒绝。
    # 关闭时启动日志会打 Warn，请不要长期关着。
    enabled: true
    # 全量对账周期。它会逐个 upsert 全部应用，过密会把对端写压力放大；
    # 同时这也是"对端数据漂移"的最长无感时间，不宜过长。下限 10s。
    interval: "5m"
    # 单次注册调用超时（与登录链路一致，3s）。
    timeout: "3s"
    # 单轮对账并发数。串行在应用多时跑不完一个周期，全并发又会形成尖峰。
    workers: 4

auth:
  # 用于筛选 app_provider_configs.env。
  env: "prod"
  # Exchange + UserInfo 的独立超时（架构 §5.7）：
  # 入站请求可能被调用方取消，但这期间三方调用必须跑完并落库，
  # 否则会出现"授权码已被平台消费、我们却拿不到令牌"。
  exchange_timeout: "5s"

log:
  level: "debug"
  format: "console"
  file: ""
  max_size_mb: 128
  max_backups: 10
  max_age_days: 30

migrate:
  # 启动时自动执行迁移。生产必须为 false（由发布流程单独执行）。
  enabled: true

audit:
  # 审计异步导出的落盘目录（§15.4 H 组）。导出 CSV 会写在这里，
  # 默认保留 7 天由后台 worker 清理。
  #
  # 置空即关闭导出 worker：提交的导出任务会一直停在 pending，
  # 启动日志会有一条 Warn 说明原因。
  export_dir: "./var/exports"
  export_file_ttl: "168h"
  # 可选：显式关闭 worker（export_dir 非空但不想在本进程跑时使用，
  # 例如把导出执行放到独立部署的 worker 容器里）。
  # export_worker_enabled: false

merge:
  # 用户中心的 Merge 是否真正按幂等键去重（§D3 硬性要求）。
  #
  # false（默认）：失败/中断的合并【不自动重试】，直接标 dead 等人工推进。
  #   理由：非幂等的 Merge 被重复执行会重复迁移订单/资产，比"合并没做完"严重得多。
  # true：补偿任务会按原幂等键重放第 2~3 步。
  #
  # 本地 stub 实现是真幂等的，因此开发环境打开以便验证补偿链路。
  # ⚠️ 接真实用户中心前，必须在其契约确认幂等后再保持 true。
  remote_idempotent: true

sms:
  # 验证码短信通道。取值 log | none。
  #
  # log  = 验证码只写日志，不真实发送（仅开发/测试可用）。
  #        生产（server.mode=release）下启动会被拒绝——用户收不到码，
  #        接口却返回 200，这种"看起来正常、实际不可用"最难排查。
  # none = 显式声明未接通道：发码接口返回 CONFIG.INVALID 而不是假装成功。
  provider: "log"

ratelimit:
  # 入站限流（架构 §6.3）。默认关闭。
  #
  # 为什么默认关闭：阈值与业务量强相关，猜一个值上线比不限制更危险——
  # 阈值偏低时正常用户会成片收到 429，而运维的第一反应往往是"服务坏了"。
  # 打开前请按实际 QPS 校准这两个数。
  enabled: false
  # /v1/oauth/notify/{platform}：无鉴权、公网可达，按 平台+IP 限。
  notify_per_minute: 120
  # 业务端 /v1/*：按 应用+客户端 IP 限（挂在 AppAuth 之后，才拿得到 app_id）。
  app_ip_per_minute: 600
  # 单个三方身份每分钟上限（rl:identity，防撞库与暴力绑定）。
  #
  # 这一档作用在授权流程内部：中间件看不到身份，只有平台返回 open_id、
  # 本服务 Upsert 出 identity 之后才有主语。阈值 30 的依据是"正常用户一分钟内
  # 不可能完成 30 次完整授权往返"；被误伤时用户等 1 分钟重试即可恢复。
  identity_per_minute: 30
  # 渠道日配额（rl:platform:{platform}:day）。超限返回 PROVIDER.QUOTA_EXCEEDED，
  # 快速失败不排队。
  #
  # 取值必须【小于】渠道后台的日上限，留 10%~20% 余量给健康探测、补偿等
  # 配额之外的调用。0 或省略 = 该渠道不限。
  # 例：wechat: 80000  alipay: 40000
  platform_daily: {}
  # 未单独列出的渠道用这个默认值，0 = 不限。
  platform_daily_default: 0

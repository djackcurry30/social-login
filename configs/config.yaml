# 三方登录统一接入服务 · 本地开发配置
#
# ⚠️ 本文件【不得包含任何真实密钥】。密钥类配置一律通过环境变量注入：
#     SOCIAL_LOGIN_SECURITY_MASTER_KEY / SOCIAL_LOGIN_SECURITY_CLAIM_SALT 等
#   （环境变量优先级高于本文件，见 internal/bootstrap/config.go 的 Load）
#
# 生产环境请复制为 configs/config.prod.yaml 并交由配置管理系统渲染，
# .gitignore 已忽略 configs/local*.yaml 与 configs/*.prod.yaml。

server:
  addr: "0.0.0.0:8080"
  # debug 会放宽若干"生产必须项"校验（允许临时密钥、允许自动迁移）。
  mode: "debug"
  # 本服务对外可访问的基地址，用于拼三方回调地址：
  #   {callback_base_url}/v1/oauth/callback/{platform}
  # 必须与三方平台后台配置的回调地址完全一致，否则平台侧会拒绝授权。
  callback_base_url: "http://localhost:8080"
  issuer: "http://localhost:8080"
  shutdown_timeout: "15s"

database:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/social_login?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"
  slow_threshold: "200ms"
  # true 会打印每条 SQL，仅开发环境开启。
  log_sql: false

cache:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20

security:
  # 信封加密主密钥（Base64，32 字节）。留空时开发模式会临时生成并打印警告。
  # 生成方式：go run ./cmd/keygen
  master_key: ""
  kek_id: "local-kek-v1"
  # 身份凭证哈希的静态盐。⚠️ 必须保持稳定：
  # 变更它会导致已入库的 claim 哈希全部无法匹配，即"按手机号归并"能力整体失效。
  claim_salt: "dev-claim-salt-do-not-use-in-prod"
  app_secret_salt: "dev-app-secret-salt-do-not-use-in-prod"

jwt:
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
  # 签名密钥。留空时开发模式会临时生成（重启即更换 kid）。
  # 生成方式：go run ./cmd/keygen
  signing_keys: []
  # 配置示例：
  # signing_keys:
  #   - kid: "k-2026-10"
  #     private_key_file: "/etc/social-login/keys/k-2026-10.pem"

account:
  # stub = 内存桩（仅开发/测试）；http = 真实用户中心（第三期交付）。
  provider: "stub"
  http:
    base_url: ""
    timeout: "3s"

auth:
  # 用于筛选 app_provider_configs.env。
  env: "prod"
  # Exchange + UserInfo 的独立超时（架构 §5.7）：
  # 入站请求可能被调用方取消，但这期间三方调用必须跑完并落库，
  # 否则会出现"授权码已被平台消费、我们却拿不到令牌"。
  exchange_timeout: "5s"

log:
  level: "debug"
  format: "console"
  file: ""
  max_size_mb: 128
  max_backups: 10
  max_age_days: 30

migrate:
  # 启动时自动执行迁移。生产必须为 false（由发布流程单独执行）。
  enabled: true

audit:
  # 审计异步导出的落盘目录（§15.4 H 组）。导出 CSV 会写在这里，
  # 默认保留 7 天由后台 worker 清理。
  #
  # 置空即关闭导出 worker：提交的导出任务会一直停在 pending，
  # 启动日志会有一条 Warn 说明原因。
  export_dir: "./var/exports"
  export_file_ttl: "168h"
  # 可选：显式关闭 worker（export_dir 非空但不想在本进程跑时使用，
  # 例如把导出执行放到独立部署的 worker 容器里）。
  # export_worker_enabled: false

merge:
  # 用户中心的 Merge 是否真正按幂等键去重（§D3 硬性要求）。
  #
  # false（默认）：失败/中断的合并【不自动重试】，直接标 dead 等人工推进。
  #   理由：非幂等的 Merge 被重复执行会重复迁移订单/资产，比"合并没做完"严重得多。
  # true：补偿任务会按原幂等键重放第 2~3 步。
  #
  # 本地 stub 实现是真幂等的，因此开发环境打开以便验证补偿链路。
  # ⚠️ 接真实用户中心前，必须在其契约确认幂等后再保持 true。
  remote_idempotent: true

sms:
  # 验证码短信通道。取值 log | none。
  #
  # log  = 验证码只写日志，不真实发送（仅开发/测试可用）。
  #        生产（server.mode=release）下启动会被拒绝——用户收不到码，
  #        接口却返回 200，这种"看起来正常、实际不可用"最难排查。
  # none = 显式声明未接通道：发码接口返回 CONFIG.INVALID 而不是假装成功。
  provider: "log"

ratelimit:
  # 入站限流（架构 §6.3）。默认关闭。
  #
  # 为什么默认关闭：阈值与业务量强相关，猜一个值上线比不限制更危险——
  # 阈值偏低时正常用户会成片收到 429，而运维的第一反应往往是"服务坏了"。
  # 打开前请按实际 QPS 校准这两个数。
  enabled: false
  # /v1/oauth/notify/{platform}：无鉴权、公网可达，按 平台+IP 限。
  notify_per_minute: 120
  # 业务端 /v1/*：按 应用+客户端 IP 限（挂在 AppAuth 之后，才拿得到 app_id）。
  app_ip_per_minute: 600
